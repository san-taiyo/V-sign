<script>
const modal=document.querySelector('#fullview-modal');
const openButton=document.querySelector('.fullview-button');
const closeButton=document.querySelector('.fullview-close');
function openFullview(){modal.classList.add('is-open');modal.setAttribute('aria-hidden','false');document.body.classList.add('modal-open')}
function closeFullview(){modal.classList.remove('is-open');modal.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open')}
openButton.addEventListener('click',openFullview);closeButton.addEventListener('click',closeFullview);modal.addEventListener('click',e=>{if(e.target===modal)closeFullview()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeFullview()});
</script>
